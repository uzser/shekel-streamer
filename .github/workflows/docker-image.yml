name: Publish Docker image

# Multi-arch image (amd64 + arm64) to GitHub Container Registry with the built-in GITHUB_TOKEN:
# no stored registry secrets. Actions are pinned to commit SHAs.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    if: github.repository == 'uzser/shekel-streamer'
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/uzser/shekel-streamer:latest
          ghcr.io/uzser/shekel-streamer:${{ github.sha }}

  # Home Assistant add-on images: ghcr.io/uzser/{arch}-shekel-streamer-addon:<version from
  # ha-addon/config.yaml>. Bump the version there for every release: HA pulls only a new tag.
  push_addon:
    if: github.repository == 'uzser/shekel-streamer'
    name: Push HA add-on image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read add-on version
      id: version
      run: |
        echo "version=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' ha-addon/config.yaml)" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push add-on image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ha-addon/Dockerfile
        push: true
        tags: ghcr.io/uzser/${{ matrix.arch }}-shekel-streamer-addon:${{ steps.version.outputs.version }}
        labels: |
          io.hass.type=addon
          io.hass.arch=${{ matrix.arch }}
          io.hass.version=${{ steps.version.outputs.version }}
