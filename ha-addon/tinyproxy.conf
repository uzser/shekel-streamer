User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
MaxClients 50
LogLevel Notice
DisableViaHeader Yes
ConnectPort 443
# Node's built-in proxy support tunnels plain http:// requests with CONNECT too: 8123 is the
# Home Assistant webhook (HEALTHCHECK_URL http://homeassistant:8123/api/webhook/...).
ConnectPort 8123
# Allow only hosts that match a line in the allowlist (extended regex, host part only).
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/shekel/allowlist"
