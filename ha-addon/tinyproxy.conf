User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
MaxClients 50
LogLevel Notice
DisableViaHeader Yes
ConnectPort 443
# Allow only hosts that match a line in the allowlist (extended regex, host part only).
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/shekel/allowlist"
